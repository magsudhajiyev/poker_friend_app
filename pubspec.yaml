name: poker_logger
publish_to: "none"
description: Final Table - Track your poker hands, stats, and bankroll
version: 1.0.3+11


environment:
  sdk: ">=3.3.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  vibration: ^2.0.0
  # Firebase dependencies
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.0
  cached_network_image: ^3.3.1
  firebase_crashlytics: ^4.3.0
  firebase_analytics: ^11.4.0
  firebase_remote_config: ^5.3.0
  firebase_messaging: ^15.1.6
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  http: ^1.2.0
  share_plus: ^10.1.2
  csv: ^6.0.0
  google_fonts: ^6.1.0
  uuid: ^4.3.3
  # Dealer-assisted logging dependencies
  crypto: ^3.0.6
  mobile_scanner: ^6.0.0
  socket_io_client: ^2.0.0
  qr_flutter: ^4.1.0
  record: ^5.1.0  # Audio recording for speech-to-text
  speech_to_text: ^7.0.0  # On-device continuous speech recognition
  fuzzywuzzy: ^1.1.6  # Fuzzy string matching for voice recognition
  web_socket_channel: ^2.4.0  # Direct WebSocket to Soniox for real-time speech
  flutter_dotenv: ^5.1.0  # Environment variable management
  app_links: ^6.1.1  # Deep linking for email invitations
  pdf: ^3.11.0  # PDF generation
  flutter_bloc: ^8.1.3  # State management for voice pipeline
  equatable: ^2.0.5  # Value equality for state objects
  purchases_flutter: ^8.1.0  # RevenueCat for subscription management
  flutter_svg: ^2.0.10+1  # SVG icon rendering
  tutorial_coach_mark: ^1.2.11  # Onboarding tour
  url_launcher: ^6.2.5  # Open URLs in browser (T&C, privacy policy)
  video_player: ^2.9.3  # Loading screen video animation

dependency_overrides:
  # Fix Linux plugin incompatibility (not needed for iOS/Android/macOS development)
  record_linux: 1.3.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/icons/
    - "assets/icons/card icons/"
    - assets/play_style/
    - "assets/loading screen.aep_AME/"
    - icons/
    - icons/flat_icons/
    - icons/figma_icons/

flutter_launcher_icons:
  android: false
  ios: false
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/logo.png"
  windows:
    generate: true
    image_path: "assets/logo.png"
  macos:
    generate: true
    image_path: "assets/logo.png"
  image_path: "assets/logo.png"
  min_sdk_android: 21

