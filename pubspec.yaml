name: poker_logger
publish_to: "none"
description: Minimal poker hand logger (tap & gesture)
version: 0.1.0+1


environment:
  sdk: ">=3.3.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  vibration: ^2.0.0
  # Firebase dependencies
  firebase_core: ^2.32.0
  cloud_firestore: ^4.15.8
  firebase_auth: ^4.17.8


flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/play_style/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "logo.png"
  windows:
    generate: true
    image_path: "logo.png"
  macos:
    generate: true
    image_path: "logo.png"
  image_path: "logo.png"
  min_sdk_android: 21

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
