name: poker_logger
publish_to: "none"
description: Poker Friend - Track your poker hands, stats, and bankroll
version: 0.1.0+3


environment:
  sdk: ">=3.3.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  fl_chart: ^1.2.0
  vibration: ^3.1.8
  # Firebase dependencies
  firebase_core: ^4.6.0
  cloud_firestore: ^6.2.0
  firebase_auth: ^6.3.0
  firebase_messaging: ^16.1.3
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  http: ^1.2.0
  share_plus: ^12.0.1
  google_fonts: ^8.0.2
  uuid: ^4.3.3
  # Dealer-assisted logging dependencies
  crypto: ^3.0.6
  mobile_scanner: ^7.2.0
  socket_io_client: ^3.1.4
  qr_flutter: ^4.1.0
  record: ^6.2.0  # Audio recording for speech-to-text
  speech_to_text: ^7.0.0  # On-device continuous speech recognition
  fuzzywuzzy: ^1.1.6  # Fuzzy string matching for voice recognition
  web_socket_channel: ^3.0.3  # Direct WebSocket to Soniox for real-time speech
  flutter_dotenv: ^6.0.0  # Environment variable management
  app_links: ^7.0.0  # Deep linking for email invitations
  pdf: ^3.11.0  # PDF generation
  flutter_bloc: ^9.1.1  # State management for voice pipeline
  equatable: ^2.0.5  # Value equality for state objects
  purchases_flutter: ^9.15.1  # RevenueCat for subscription management
  flutter_svg: ^2.0.10+1  # SVG icon rendering

dependency_overrides:
  # Fix Linux plugin incompatibility (not needed for iOS/Android/macOS development)
  record_linux: 1.3.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/play_style/
    - icons/
    - icons/flat_icons/
    - icons/figma_icons/
    - logo.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "logo.png"
  windows:
    generate: true
    image_path: "logo.png"
  macos:
    generate: true
    image_path: "logo.png"
  image_path: "logo.png"
  min_sdk_android: 21

